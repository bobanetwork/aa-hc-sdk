[profile.default]
src = 'hc_src'
out = 'out'
libs = ['lib']
test = 'test'
cache_path = 'cache'
solc_version = '0.8.26'
optimizer = true
optimizer_runs = 200
evm_version = 'cancun'
cbor_metadata = true
allow_internal_expect_revert = true
via_ir = true

# for OpenZeppelin plugin
ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]

remappings = [
    '@forge-std/=lib/forge-std/src',
    'ds-test/=lib/forge-std/lib/ds-test/src/',
    '@openzeppelin/contracts/=lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/contracts/',
    '@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/',
    'account-abstraction/v0_7/=lib/account-abstraction/contracts/',
    '@account-abstraction/=lib/account-abstraction/contracts/'
]

[etherscan]
boba_sepolia = {key = "verifyContract", chain = 28882, url = "https://api.routescan.io/v2/network/testnet/evm/28882/etherscan" }
boba_mainnet = {key = "verifyContract", chain = 288, url = "https://api.routescan.io/v2/network/mainnet/evm/288/etherscan" }
